<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UTSocial</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="app">

      <!-- LOGIN PAGE -->
      <section id="auth" class="card">
        <h1>UTSocial</h1>
        <p class="subtitle">Campus map, events, and friends.</p>

        <input id="username" placeholder="Username" />
        <input id="password" type="password" placeholder="Password" />

        <button id="loginBtn">Login</button>
        <button id="goToRegisterBtn" class="ghost">Create account</button>

        <p id="message"></p>
      </section>

      <!-- REGISTER PAGE -->
      <section id="register" class="card hidden">
        <h1>Create Account</h1>

        <input id="regUsername" placeholder="Username" />
        <input id="regPassword" type="password" placeholder="Password" />

        <button id="submitRegisterBtn">Register</button>
        <button id="backToLoginBtn" class="ghost">Back to login</button>

        <p id="registerMessage"></p>
      </section>

      <!-- DASHBOARD -->
      <section id="dashboard" class="card hidden">
        <div class="topbar">
          <h1>Map</h1>

          <div class="top-actions">
            <button id="goToFriendsBtn">Friends</button>
            <button id="goToAddEventBtn">Add Event</button>

            <div class="settings-container">
              <button id="settingsBtn">⚙️</button>
              <div id="settingsDropdown" class="settings-dropdown">
                <button id="deleteAccountBtn">Delete Account</button>
              </div>
            </div>
          </div>
        </div>

        <p id="welcome"></p>

        <div class="events-box">
          <h3>Events</h3>
          <div id="eventItems"></div>
        </div>

        <div id="map"></div>

        <button id="logoutBtn" class="logout">Logout</button>
      </section>

      <!-- FRIENDS PAGE -->
      <section id="friendsPage" class="card hidden">
        <h1>Friends</h1>

        <div class="friend-box">
          <h3>Add Friend</h3>

          <input
            id="friendUsernameInput"
            placeholder="Username to add"
          />

          <button id="sendFriendRequestBtn" class="primary">
            Send Friend Request
          </button>
        </div>

        <div class="friend-box">
          <h3>Incoming Requests</h3>

          <div id="incomingRequests">
            <p>No incoming requests.</p>
          </div>
        </div>

        <div class="friend-box">
          <h3>Your Friends</h3>

          <div id="friendsList">
            <p>No friends yet.</p>
          </div>
        </div>

        <button id="backToDashboardBtn" class="ghost">
          Back to Map
        </button>
      </section>

      <!-- ADD EVENT PAGE -->
      <section id="addEventPage" class="card hidden">
        <h1>Add Event</h1>

        <input id="eventName" placeholder="Event name" />
        <input id="eventOrganizer" placeholder="Organizer" />
        <input id="eventDate" placeholder="Date / time" />

        <select id="eventBuilding">
          <option value="">Select Building</option>
        </select>

        <textarea id="eventDescription" placeholder="Description"></textarea>

        <button id="submitEventBtn">Submit Event</button>
        <button id="cancelEventBtn" class="ghost">Cancel</button>
      </section>

    </main>
  </body>
</html>
