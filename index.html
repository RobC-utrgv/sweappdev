<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

  :root {
    --primary: #f97316;         /* Orange-500 */
    --primary-hover: #ea580c;   /* Orange-600 */
    --background: #f9fafb;      /* Light neutral */
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --error: #dc2626;
    --success: #16a34a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h2 {
    margin-top: 0;
    font-weight: 600;
    text-align: center;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    margin: 8px 0 14px 0;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    outline: none;
  }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15);
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  button.primary {
    background: var(--primary);
    color: white;
  }

  button.primary:hover {
    background: var(--primary-hover);
  }

  button.secondary {
    background: transparent;
    color: var(--primary);
  }

  button.secondary:hover {
    text-decoration: underline;
  }

  p {
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
  }


#map {
  width: 100%;
  height: 400px;
  margin-top: 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
}


  .card {
    background: var(--card-bg);
    width: 320px;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  }

  .hidden {
    display: none;
  }

  #dashboard p {
    color: var(--muted);
  }


    body { font-family: Arial; margin: 40px; }
    input { margin: 5px 0; display: block; padding: 5px; }
    button { margin: 5px 0; padding: 5px 10px; }
    
  </style>
</head>

<body>

  <div id="auth" class="card">
    <h2>Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>
    <button id="goToRegisterBtn">Go to Register</button>

    <p id="message"></p>
  </div>

  <div id="register" class = "card hidden">
    <h2>Register</h2>

    <input id="regUsername" placeholder="Desired Username">
    <input id="regPassword" type="password" placeholder="Desired Password">
    <button id="submitRegisterBtn">Register</button>

    <p id="registerMessage"></p>

    <button id="backToLoginBtn">Back to Login</button>
  </div>

  <div id="dashboard" class="card hidden">
  <h2>Map</h2>
    <p id="welcome"></p>
  <div id="map"></div>

  <button id="logoutBtn" class="secondary">Logout</button>
</div>

  <script type="module" src="./main.js"></script>
</body>
</html>
