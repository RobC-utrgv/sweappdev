<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login App</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >


  <style>

  :root {
    --primary: #f97316;         
    --primary-hover: #ea580c;   
    --background: #f9fafb;      
    --card-bg: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --error: #dc2626;
    --success: #16a34a;
  }


  [data-theme="dark"] {
    --primary: #fb923c;
    --primary-hover: #f97316;
    --background: #0f172a;
    --card-bg: #020617;
    --border: #1e293b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --error: #f87171;
    --success: #4ade80;
  }


  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  h2 {
    margin-top: 0;
    font-weight: 600;
    text-align: center;
  }

  input {
    width: 100%;
    padding: 10px 12px;
    margin: 8px 0 14px 0;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    outline: none;
  }

  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15);
  }

  button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  button.primary {
    background: var(--primary);
    color: white;
  }

  button.primary:hover {
    background: var(--primary-hover);
  }

  button.secondary {
    background: transparent;
    color: var(--primary);
  }

  button.secondary:hover {
    text-decoration: underline;
  }

  p {
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
  }


  #map {
    width: 100%;
    height: 400px;
    margin-top: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }


  .card {
    background: var(--card-bg);
    width: 320px;
    padding: 24px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
  }

  .hidden {
    display: none;
  }

  #dashboard p {
    color: var(--muted);
  }

  .settings-container {
    position: relative;
  }

  .settings-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
  }

  .settings-dropdown {
    position: absolute;
    right: 0;
    top: 28px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 150px;
    display: none;
    z-index: 1000;
  }

  .settings-dropdown .dropdown-item {
    width: 100%;
    padding: 10px;
    background: none;
    border: none;
    text-align: left;
    color: var(--error);
    cursor: pointer;
  }

  .settings-dropdown .dropdown-item:hover {
    background: #f5f5f5;
  }


  .theme-switch {
    position: relative;
    width: 42px;
    height: 22px;
  }

  .theme-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .theme-switch .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #ccc;
    border-radius: 22px;
    transition: 0.3s;
  }

  .theme-switch .slider::before {
    content: "";
    position: absolute;
    height: 18px;
    width: 18px;
    left: 2px;
    bottom: 2px;
    background-color: white;
    border-radius: 50%;
    transition: 0.3s;
  }

  .theme-switch input:checked + .slider {
    background-color: var(--primary);
  }

  .theme-switch input:checked + .slider::before {
    transform: translateX(20px);
  }


    body { font-family: Arial; margin: 40px; }
    input { margin: 5px 0; display: block; padding: 5px; }
    button { margin: 5px 0; padding: 5px 10px; }
    
  </style>
</head>

<body>

  <div id="auth" class="card">
    <h2>Login</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button id="loginBtn">Login</button>
    <button id="goToRegisterBtn">Go to Register</button>

    <p id="message"></p>
  </div>

  <div id="register" class = "card hidden">
    <h2>Register</h2>

    <input id="regUsername" placeholder="Desired Username">
    <input id="regPassword" type="password" placeholder="Desired Password">
    <button id="submitRegisterBtn">Register</button>

    <p id="registerMessage"></p>

    <button id="backToLoginBtn">Back to Login</button>
  </div>

  <div id="dashboard" class="card hidden">


    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h2 style="margin:0;">Map</h2>

      <div style="display:flex; align-items:center; gap:12px;">

        <button id="goToAddEventBtn" class="secondary">
          Add Event
        </button>

        <label class="theme-switch">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
        <div class="settings-container">
          <button id="settingsBtn" class="settings-btn" aria-label="Settings">
            ⚙️
          </button>
          <div id="settingsDropdown" class="settings-dropdown">
            <button class="dropdown-item" id="deleteAccountBtn">
               Delete Account
            </button>
          </div>
        </div>
      </div>
    </div>
  <p id="welcome"></p>
  
  <div id="eventList"
       style="
         width:200px;
         max-height:400px;
         overflow-y:auto;
         border:1px solid var(--border);
         border-radius:8px;
         padding:8px;
       ">
    <strong>Events</strong>
    <div id="eventItems"></div>
  </div>

  <div id="map"></div>
  <button id="logoutBtn" class="secondary">Logout</button>

  </div>

  <div id="addEventPage" class="card hidden">
    <h2>Add Event</h2>

    <input id="eventName" placeholder="Event Name">
    <input id="eventOrganizer" placeholder="Event Organizer">
    <input id="eventDate" type="date">
    <textarea id="eventDescription" placeholder="Description"></textarea>

    <select id="eventBuilding">
      <option value="">Select Building</option>
    </select>

    <button id="submitEventBtn" class="primary">Submit Event</button>
    <button id="cancelEventBtn" class="secondary">Cancel</button>
  </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
